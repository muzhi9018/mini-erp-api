    const grouped = number => number.toLocaleString('en-US');
    const symbols = {CNY:'¥', TWD:'NT$'};
    const symbol = ccy => symbols[ccy] || '';
    const withCurrency = (amount, ccy) => symbol(ccy) ? `${symbol(ccy)} ${amount}` : amount;
    const money = (cents, ccy) => cents == null ? '—' : withCurrency(`${grouped(cents / 100n)}.${String(cents % 100n).padStart(2,'0')}`,ccy);
    const priceText = (value, ccy) => {
        if (value == null) return '—';
        const [whole, fraction = ''] = value.split('.');
        return withCurrency(`${grouped(BigInt(whole))}.${fraction.replace(/0+$/, '').padEnd(2, '0')}`,ccy);

    const catalog = [
        {id:'CAB-2D-GY', name:'两门金属衣柜', model:'LM-02', spec:'石墨灰 · 宽 900 mm', category:'储物设备', color:'灰色', unit:'件', scale:0, price:'129.345', currency:'CNY'},

        {id:'SHE-4L-WH', name:'四层展示架', model:'DS-400', spec:'暖白 · 四层', category:'展示道具', color:'白色', unit:'组', scale:0, price:'120.00', currency:'CNY'},

        {id:'PAN-BO-80', name:'桦木饰面板', model:'BO-800', spec:'原木 · 宽 800 mm', category:'装潢材料', color:'原木', unit:'张', scale:0, price:null, currency:null},

        '若現場位置需調整，請於出貨前三個工作日完成確認。照明色溫與展示架規格依本單列示內容交付。'
    ];
    const longRows = Array.from({length:14}, (_,index) => sourceLine(
        ['CAB-3D-SD','TRK-AL-24','LGT-WM-35'][index % 3],
        index % 3 === 1 ? '2.125' : String(index % 4 + 1),
        index % 4 === 0 ? rate(9) : neutral(),

    ));
    longRows.push(line({...sku('LGT-WM-35'), price:'0'},'1',neutral(),'隨主單附送，收貨時請與安裝配件一同點收。',true));
    const quotes = [
        seeded('q1','QT-20261122-006','展厅储物设备报价',seedTime('22','15:40'),{name:'禾木设计事务所',contact:'林青',phone:'021-5550-0136',address:'上海市长宁区澄川路 28 号 A 栋 4 楼样品室'},[
            sourceLine('CAB-2D-GY','2',rate(9),'按客户要求贴分区标签。'), sourceLine('PAP-LI-60','1.50',fixed('100.00'),'按 600 mm 宽幅裁切。')
        ],rate(9.5),'交期另行确认。送货前请联系收货人。'),
        seeded('q2','QT-1151122-005','展櫃與導軌配置報價',seedTime('22','14:30'),{name:'向野展示設計',contact:'陳怡君',phone:'02-5550-0128',address:'新北市板橋區文景路二段 128 號 6 樓，展示設備收貨窗口。貨車請經北側卸貨入口上坡至 B1，抵達後先至管理室登記，再依管理員指示前往指定卸貨月台。'},longRows,rate(9.8),'交付批次請由雙方共同確認。尺寸以確認圖為準，施工現場需保留完整動線。',true),
        seeded('q3','QT-20261121-004','陈列台与配件补货报价',seedTime('21','16:08'),{name:'照见零售空间'},[sourceLine('SHE-4L-WH','6',rate(8.5)),sourceLine('SIG-AC-A5','6')],neutral(),'含首批台卡样品。'),
        seeded('q4','QT-1151121-003','門市燈條增補報價',seedTime('21','11:26'),{name:'日和生活選物'},[sourceLine('LGT-WM-35','12')],fixed('9000'),'依指定時段送貨。'),
        seeded('q5','QT-20261120-003','滨江店样品物料报价',seedTime('20','17:05'),{name:'松岸商业设计'},[sourceLine('PAP-LI-60','12.50'),sourceLine('SHE-4L-WH','5')],rate(9),'',true),
        seeded('q6','QT-1151120-002','辦公區置物櫃報價',seedTime('20','10:20'),{name:'序物工作室'},[sourceLine('CAB-3D-SD','4')]),
        seeded('q7','QT-20261119-002','样品室标识物料报价',seedTime('19','15:48'),{name:'向光品牌顾问'},[sourceLine('SIG-AC-A5','3')]),
        seeded('q8','QT-20261119-001','前台展示架报价',seedTime('19','09:15'),{},[sourceLine('SHE-4L-WH','8')],rate(9),'预留样品确认。',true)
    ];
    function templateRow(id, discount = '') {
        return {rid:++serial, id, discount};
    }
    const templates = [
        {id:'t1', scope:'personal', name:'门店陈列 · 常用组合', title:'门店陈列设备报价', discount:'9.5', updated:seedTime('22','14:20'), version:0, rows:[templateRow('SHE-4L-WH','9'), templateRow('SHE-4L-WH','8')]},
        {id:'t2', scope:'personal', name:'软装材料 · 标准配置', title:'装潢材料报价单', discount:'', updated:seedTime('21','10:00'), version:0, rows:[templateRow('PAP-LI-60'), templateRow('SIG-AC-A5')]},
        {id:'t3', scope:'personal', name:'开业物料 · 待修复', title:'开业物料报价', discount:'9.2', updated:seedTime('20','10:00'), version:0, rows:[templateRow('SHE-4L-WH'), templateRow('RCK-FL-09','9'), templateRow('CAB-3D-SD'), templateRow('DEL-040')]},
        {id:'t4', scope:'public', name:'台灣門市 · 展櫃與導軌', title:'門市展示設備報價', discount:'9.9', updated:seedTime('22','11:40'), version:0, rows:[templateRow('CAB-3D-SD'), templateRow('TRK-AL-24','9'), templateRow('LGT-WM-35')]},
        {id:'t5', scope:'public', name:'展厅项目 · 物料篮', title:'展厅基础物料报价', discount:'', updated:seedTime('20','11:20'), version:0, rows:[templateRow('CAB-2D-GY'), templateRow('PAP-LI-60'), templateRow('SIG-AC-A5')]},
        {id:'t6', scope:'public', name:'装潢备选 · 待维护售价', title:'饰面材料报价', discount:'', updated:seedTime('19','12:00'), version:0, rows:[templateRow('PAN-BO-80')]}
    ];
    const state = {
        view:'list', scope:'personal', quote:null, template:null, draft:null, templateDraft:null,
        quoteFilters:{query:'', start:'', end:'', status:'', page:1, size:10},
        templateFilters:{personal:{query:'', page:1, size:10}, public:{query:'', page:1, size:10}},
        paper:null, picker:null, modal:null
    };
    const quoteBy = id => quotes.find(quote => quote.id === id && !quote.deleted);
    const templateBy = id => templates.find(template => template.id === id);
    const currencyOf = draft => draft.lockCurrency || draft.rows[0]?.product.currency || '';

    function decimal(value, scale, maxWhole = 14, allowTrailing = false) {
        const match = /^(\d+)(?:\.(\d+))?$/.exec(String(value).trim());
        if (!match) return null;
        const whole = match[1].replace(/^0+(?=\d)/,'');
        const fraction = allowTrailing ? (match[2] || '').replace(/0+$/,'') : (match[2] || '');
        if (whole.length > maxWhole || fraction.length > scale) return null;
        return BigInt(whole + fraction.padEnd(scale,'0'));
    }
    const round = (amount, divisor) => (amount + divisor / 2n) / divisor;
    const foldError = '折扣须为 0～10 折，最多三位小数。';
    function foldValue(input) {
        const scaled = decimal(input,3,2);
        return scaled != null && scaled <= 10000n ? scaled : null;
    }
    function foldNumber(input) {
        const scaled = foldValue(input);
        if (scaled == null) return '';
        const fraction = String(scaled % 1000n).padStart(3,'0').replace(/0+$/,'');
        return `${scaled / 1000n}${fraction ? `.${fraction}` : ''}`;
    }
    function foldText(input) {
        const fold = foldNumber(input);
        return fold ? `${fold} 折` : '—';
    }
    const savedDiscount = discount => discount.mode === 'rate' ? rate(foldNumber(discount.value)) : clone(discount);
    function discountTotal(amount, discount, ccy) {
        if (amount == null) return {value:null, error:''};
        if (!discount?.value.trim() || discount.mode === 'none') return {value:amount, error:''};
        if (discount.mode === 'rate') {
            const fold = foldValue(discount.value);
            return fold == null ? {value:null,error:foldError} : {value:round(amount * fold,10000n),error:''};
        }
        const input = decimal(discount.value,2);
        if (input == null || input > amount) return {value:null, error:`金额须为 ${money(0n,ccy)}～${money(amount,ccy)}，最多两位小数。`};
        return {value:input,error:''};
    }
    function calculate(draft) {
        const maxCents = 9999999999999999n;
        const lines = draft.rows.map(row => {
            const quantity = decimal(row.qty,row.product.scale,14,true);
            if (quantity == null || quantity <= 0n) {
                const quantityError = `请输入大于 0 的数量，最多 14 位整数${row.product.scale ? `、${row.product.scale} 位小数` : '，此 SKU 只支持整数'}。`;
                return {rid:row.rid, original:null, value:null, error:'', quantityError};
            }
            const raw = decimal(row.qty,6,14,true) * decimal(row.product.price,6);
            const original = round(raw,10000000000n);
            if (original > maxCents) return {rid:row.rid, original:null, value:null, error:'', quantityError:'行原价超出金额范围，请减少数量。'};
            return {rid:row.rid, original, quantityError:'', ...discountTotal(original,row.discount,row.product.currency)};
        });
        const sum = key => lines.some(row => row[key] == null) ? null : lines.reduce((total,row) => total + row[key],0n);
        const original = sum('original');
        const subtotal = sum('value');
        const final = original > maxCents || subtotal > maxCents ? {value:null,error:'汇总金额超出限额，请减少数量或拆分报价。'} : discountTotal(subtotal,draft.discount,currencyOf(draft));
        return {lines, original, subtotal, final:final.value, finalError:final.error};
    }

    function button(label, action, options = {}) {
        const {glyph, look = '', id, disabled, aria, extra = ''} = options;
        const cls = look === 'link' || look === 'link-danger' ? `qt-link ${look === 'link-danger' ? 'qt-danger' : ''}` : `qt-btn ${look ? `qt-${look}` : ''}`;
        return `<button type="button" class="${cls}" data-act="${action}" ${id != null ? `data-id="${escape(id)}"` : ''} ${aria ? `aria-label="${escape(aria)}"` : ''} ${aria && !label ? `data-tooltip="${escape(aria)}"` : ''} ${disabled ? 'disabled' : ''} ${extra}>${glyph ? icon(glyph) : ''}${escape(label)}</button>`;
    }
    const status = (label, kind = '') => `<span class="qt-status ${kind ? `qt-${kind}` : ''}">${escape(label)}</span>`;
    const quoteStatus = quote => status(quote.generated ? '已生成订单' : '未生成订单',quote.generated ? 'green' : '');
    const link = (label,action,id) => button(label,action,{id,look:'link'});
    const banner = (text, kind = '') => `<div class="qt-banner ${kind ? `qt-${kind}` : ''}" ${kind === 'error' ? 'role="alert"' : ''}>${icon(kind ? 'circle-alert' : 'info')}<span>${escape(text)}</span></div>`;
    function field(label, attrs, value, options = {}) {
        const {required, multiline, hint, errorKey} = options;
        const errorId = errorKey ? `qt-err-${errorKey}` : '';
        const control = multiline ? `<textarea ${attrs}>
${escape(value)}</textarea>` : `<input ${attrs} value="${escape(value)}" ${errorId ? `aria-describedby="${errorId}"` : ''}>`;
        return `<label class="qt-field"><span>${escape(label)}${required ? ' <span class="qt-required" aria-hidden="true">*</span>' : ''}${hint ? ` <span class="qt-muted">${escape(hint)}</span>` : ''}</span>${control}${errorId ? `<span class="qt-inline-error" id="${errorId}"></span>` : ''}</label>`;
    }
    const option = (value,label,current) => `<option value="${escape(value)}"${value === current ? ' selected' : ''}>${escape(label)}</option>`;
    const options = (items,current) => items.map(([key,label]) => option(key,label,current)).join('');
    const search = (label,key,value) => `<label class="qt-search">${icon('search')}<input type="search" aria-label="${escape(label)}" data-bind="${key}" placeholder="${escape(label)}" value="${escape(value)}"></label>`;
    const empty = (heading, copy, action = '') => `<div class="qt-empty"><span class="qt-empty-icon">${icon('file-search')}</span><h3>${escape(heading)}</h3>${copy ? `<p>${escape(copy)}</p>` : ''}${action}</div>`;
    const panel = content => `<section class="qt-panel qt-pad">${content}</section>`;
    const sectionHeading = (title, actions = '') => `<div class="qt-section"><h2>${escape(title)}</h2>${actions}</div>`;
    function heading(title, subtitle, actions, options = {}) {
        const {crumb = '', badge = ''} = options;
        const mainCrumb = crumb ? button('报价管理','list',{look:'link'}) : '<span>销售管理</span>';
        return `<header class="qt-header qt-gutter"><div class="qt-crumb">${mainCrumb}${icon('chevron-right')}<span>${escape(crumb || '报价管理')}</span></div><div class="qt-headline"><div><div class="qt-head-title"><h1>${escape(title)}</h1>${badge}</div>${subtitle ? `<p>${escape(subtitle)}</p>` : ''}</div><div class="qt-row">${actions}</div></div></header>`;
    }
    function shell(content) {
        const current = state.view.startsWith('template') ? 'templates' : 'list';
        const links = [['报价单列表','list','files'],['报价模板','templates','layers']];
        const nav = links.map(([label,action,glyph]) => `<button type="button" data-act="${action}" aria-label="${label}" data-tooltip="${label}" data-tooltip-placement="right" ${current === action ? 'aria-current="location"' : ''}>${icon(glyph)}<span class="qt-sidebar-label">${label}</span></button>`).join('');
        return `<div class="qt-shell"><aside class="qt-rail"><nav class="qt-sidebar" aria-label="报价管理菜单"><div class="qt-sidebar-heading">报价管理</div>${nav}</nav></aside><div class="qt-workspace">${content}</div></div>`;
    }
    const work = body => `<main class="qt-work qt-gutter qt-stack">${body}</main>`;
    const table = (header,rows,cls = '') => `<div class="qt-tablewrap"><table class="qt-table ${cls}"><thead><tr>${header}</tr></thead><tbody>${rows}</tbody></table></div>`;
    const ths = labels => labels.map(label => Array.isArray(label) ? `<th scope="col" class="${label[1]}">${label[0]}</th>` : `<th scope="col">${label}</th>`).join('');
    function pager(count, filters, key) {
        const pages = Math.max(1,Math.ceil(count / filters.size));
        filters.page = Math.min(pages,filters.page);
        return `<div class="qt-pager qt-row qt-between"><span class="qt-muted">共 ${count} 条记录</span><div class="qt-row"><select aria-label="每页条数" data-bind="${key}-size">${options([[10,'10 条 / 页'],[5,'5 条 / 页'],[20,'20 条 / 页']],filters.size)}</select>${button('',`${key}-page`,{id:-1,glyph:'chevron-left',aria:'上一页',look:'icon-btn',disabled:filters.page === 1})}<span class="qt-muted qt-number">${filters.page} / ${pages}</span>${button('',`${key}-page`,{id:1,glyph:'chevron-right',aria:'下一页',look:'icon-btn',disabled:filters.page === pages})}</div></div>`;
    }
    const slicePage = (rows,filters) => rows.slice((filters.page - 1)*filters.size,filters.page*filters.size);
    let toastTimer;
    function inform(text) {
        clearTimeout(toastTimer);
        toast.textContent = text;
        toast.hidden = false;
        toastTimer = setTimeout(() => { toast.hidden = true; },3800);
    }
    function go(view) {
        state.view = view;
        render();
        root.scrollIntoView({block:'start'});
    }
    function quoteActions(quote) {
        return `<div class="qt-line-actions">${link('详情','detail',quote.id)}${quote.generated ? '' : link('修改','edit',quote.id)}${link('生成新报价','copy',quote.id)}${quote.generated ? '' : button('删除','delete',{id:quote.id,look:'link-danger'})}</div>`;
    }
    function quoteResults() {
        const f = state.quoteFilters;
        const query = f.query.trim().toLowerCase();
        const records = quotes.filter(quote => !quote.deleted && [quote.title,quote.number,quote.customer.name].some(value => value.toLowerCase().includes(query)) && (!f.status || (f.status === 'generated') === quote.generated) && (!f.start || quote.date.slice(0,10) >= f.start) && (!f.end || quote.date.slice(0,10) <= f.end));
        records.sort((a,b) => b.date.localeCompare(a.date));
        const pages = pager(records.length,f,'quote');
        const rows = slicePage(records,f).map(quote => {
            const ccy = currencyOf(quote);
            const total = calculate(quote).final;

            tr.innerHTML = `<td class="qt-sheet-small qt-number">${number}</td><td colspan="5"><p class="qt-sheet-note"><strong>${paperLabel(quote,'行备注（续）')}</strong>　${escape(note)}</p></td>`;
        } else {
            tr.innerHTML = `<td class="qt-sheet-small qt-number">${number}</td><td><strong>${escape(product.name)}</strong><div class="qt-sheet-small">${escape(product.model)} · ${escape(product.spec)}</div><div class="qt-sheet-small qt-mono">${escape(product.id)}</div>${note ? `<p class="qt-sheet-note"><strong>${paperLabel(quote,'备注')}</strong>　${escape(note)}</p>` : ''}</td><td class="qt-end">${escape(row.qty)} ${escape(product.unit)}</td><td class="qt-end qt-sheet-money">${priceText(product.price,product.currency)}${currencyLine(product.currency)}</td><td class="qt-end${row.discount.mode === 'amount' ? ' qt-sheet-money' : ''}">${discountText(row.discount,product.currency,true)}</td><td class="qt-end qt-sheet-money"><strong>${money(result.value,product.currency)}</strong>${currencyLine(result.value == null ? '' : product.currency)}</td>`;
        }
        return tr;
    }
    function paperTotals(quote,result,note,continued = false,withTotals = true) {
        const t = text => paperLabel(quote,text);
        const ccy = currencyOf(quote);
        const discount = (name,value,detail = '') => value > 0n || detail ? `<div><dt>${name}${detail ? ` · ${detail}` : ''}</dt><dd class="qt-number">${value > 0n ? '−' : ''}${money(value,ccy)}</dd></div>` : '';
        const orderFold = quote.discount.mode === 'rate' && quote.discount.value.trim() ? foldText(quote.discount.value) : '';
        const final = money(result.final);
        const amountRows = `<dl class="qt-sheet-total"><div><dt>${t('商品原价合计')}</dt><dd class="qt-number">${money(result.original,ccy)}</dd></div>${discount(t('商品优惠'),result.original-result.subtotal)}<div><dt>${t('商品小计')}</dt><dd class="qt-number">${money(result.subtotal,ccy)}</dd></div>${discount(t('整单优惠'),result.subtotal-result.final,orderFold)}<div class="qt-final"><dt>${t('报价总额')}</dt><dd class="qt-number">${totalSymbol(result.final,ccy)}<strong${final.length > 13 ? ' class="qt-long-money"' : ''}>${final}</strong></dd></div></dl>`;
        const el = document.createElement('section');
        el.className = 'qt-sheet-bottom';
        el.innerHTML = `<div>${note ? `<strong>${t('报价备注')}${continued ? t('（续）') : ''}</strong><p class="qt-sheet-note">${escape(note)}</p>` : ''}</div>${withTotals ? amountRows : ''}`;
        return el;
    }
    function layoutPaper() {
        const target = root.querySelector('.qt-docs');
        const quote = state.paper.quote;
        const result = calculate(quote);
        const measurement = document.createElement('div');
        measurement.className = 'qt-measure';
        target.append(measurement);
        const pages = [];
        let page;
        let entries = 0;
        const nextPage = () => {
            page = paperSkeleton(quote,pages.length === 0);
            measurement.append(page.frame);
            pages.push(page);
            entries = 0;
        };
        const fits = (parent,node,measured = page) => {
            parent.append(node);
            if (measured.body.scrollHeight <= measured.body.clientHeight + 1) return true;
            node.remove();
            return false;
        };
        function splitText(text, makeNode, parent) {
            const letters = Array.from(text);
            let low = 1;
            let high = letters.length;
            let best = 0;
            while (low <= high) {
                const middle = Math.floor((low + high) / 2);
                const probe = makeNode(letters.slice(0,middle).join(''));
                if (fits(parent,probe)) { probe.remove(); best = middle; low = middle + 1; }
                else high = middle - 1;
            }
            const consumed = Math.max(best,1);
            parent.append(makeNode(letters.slice(0,consumed).join('')));
            return letters.slice(consumed).join('');
        }
        nextPage();
        quote.rows.forEach((row,index) => {
            const create = (note,continued) => paperLine(quote,row,result.lines[index],index,note,continued);
            if (!fits(page.rows,create(row.note,false))) {
                if (entries) nextPage();
                if (!fits(page.rows,create(row.note,false))) {
                    if (pages.length === 1) {
                        const continuation = paperSkeleton(quote,false);
                        measurement.append(continuation.frame);
                        if (fits(continuation.rows,create(row.note,false),continuation)) {
                            pages.push(continuation);
                            page = continuation;
                            entries = 1;
                            return;
                        }
                        continuation.frame.remove();
                    }
                    let remaining = splitText(row.note,note => create(note,false),page.rows);
                    while (remaining) {
                        nextPage();
                        if (fits(page.rows,create(remaining,true))) break;
                        remaining = splitText(remaining,note => create(note,true),page.rows);
                    }
                }
            }
            entries++;
        });
        const totals = (note,continued,withTotals) => paperTotals(quote,result,note,continued,withTotals);
        if (!fits(page.body,totals(quote.note,false,true))) {
            nextPage();
            let remaining = quote.note;
            let continued = false;
            while (!fits(page.body,totals(remaining,continued,true))) {
                remaining = splitText(remaining,note => totals(note,continued,false),page.body);
                continued = true;
                nextPage();
            }
        }
        pages.forEach(({frame},index) => {
            frame.querySelector('[data-page-number]').textContent = `${index+1} / ${pages.length}`;
            target.append(frame);
        });
        measurement.remove();
        const count = root.querySelector('#qt-doc-count');
        if (count) count.textContent = `共 ${pages.length} 页`;
        scalePaper();
    }
    let desktopViewportHeight = 0;
    function scalePaper() {
        const target = root.querySelector('.qt-docs');
        if (!target) return;
        const fitHeight = state.paper.shot && desktopViewportHeight ? Math.max(200,desktopViewportHeight - 106) / 1123 : 1;
        const scale = Math.min(1,(target.clientWidth - 24)/794,fitHeight);
        target.querySelectorAll('.qt-sheet-frame').forEach(frame => {
            frame.style.width = `${794*scale}px`;
            frame.style.height = `${1123*scale}px`;
            frame.firstElementChild.style.transform = `scale(${scale})`;
        });
    }
    new ResizeObserver(scalePaper).observe(root);
    window.addEventListener('resize',scalePaper);
    if (document.documentElement.hasAttribute('data-visualize-standalone')) {
        window.addEventListener('message',event => {
            if (event.source !== window.parent || event.data?.type !== 'quotation-prototype-viewport' || !Number.isFinite(event.data.height)) return;
            desktopViewportHeight = event.data.height;
            scalePaper();
        });
    }

    const renderers = {list:renderList, editor, detail:quoteDetail, paper:paperView, templates:templateList, 'template-detail':templateDetail, 'template-editor':templateEditor};
    function render() {
        const content = renderers[state.view]();
        screen.innerHTML = state.view === 'paper' ? content : shell(content);
        if (state.view === 'editor') syncEditor();
        if (state.view === 'template-editor') syncTemplate();
        if (state.view === 'paper') layoutPaper();
        icons();
    }
    function refreshResults(id, view) {
        root.querySelector(id).innerHTML = view();
        icons();
    }
    function leaveQuote(next, scope = state.scope) {
        const draft = state.draft;
        const leave = () => { state.scope = scope; state.draft = null; state.paper = null; go(next); };
        if (draft?.dirty) ask('放弃本次编辑？','本次修改尚未保存。离开后将丢弃当前草稿。','放弃编辑',leave,'danger');
        else leave();
    }
    function leaveTemplate(next, scope = state.templateDraft.scope) {
        const leave = () => { state.scope = scope; state.templateDraft = null; go(next); };
        if (state.templateDraft.dirty) ask('放弃模板修改？','本次修改尚未保存。','放弃编辑',leave,'danger');
        else leave();
    }
    function navigateSection(view, scope = state.scope) {
        if (state.view === 'editor') { leaveQuote(view,scope); return; }
        if (state.view === 'template-editor') { leaveTemplate(view,scope); return; }
        state.scope = scope;
        go(view);
    }
    function makeTemplateDraft(id) {
        const template = id && templateBy(id);
        state.templateDraft = template ? {...clone(template),dirty:false} : {scope:state.scope,name:'',title:'',discount:'',rows:[],dirty:false};
        if (template) state.template = id;
        go('template-editor');
    }
    function clearMessage(id) {
        const node = root.querySelector(id);
        if (node?.childElementCount) node.replaceChildren();
    }
    function bindInput(input) {
        const [group, name, part] = input.dataset.bind.split('-');
        const {value} = input;
        const draft = state.draft;
        if (group === 'quote') {
            const f = state.quoteFilters;
            f[name] = name === 'size' ? Number(value) : value;
            f.page = 1;
            refreshResults('#qt-quote-results',quoteResults);
            if (name === 'size') root.querySelector('[data-bind="quote-size"]').focus();
            return;
        }
        if (group === 'picker') {
            const p = state.picker;
            p[name] = name === 'size' ? Number(value) : value;
            p.page = 1;
            pickerResults();
            if (name === 'size') dialog.querySelector('[data-bind="picker-size"]').focus();
            return;
        }
        if (input.dataset.bind === 'select-sku') {
            const p = state.picker;
            const product = sku(value);
            if (p.replace) p.selected.clear();
            if (input.checked) p.selected.set(value,product);
            else p.selected.delete(value);
            pickerResults();
            dialog.querySelector(`[data-bind="select-sku"][value="${value}"]`)?.focus();
            return;
        }
        if (group === 'copy') { state.modal.clear = value === 'clear'; return; }
        if (group === 'save') { state.modal[name === 'scope' ? 'scope' : 'name'] = value; return; }
        if (group === 'template') {
            if (name === 'query' || name === 'size') {
                const f = state.templateFilters[state.scope];
                f[name] = name === 'size' ? Number(value) : value;
                f.page = 1;
                refreshResults('#qt-template-results',templateResults);
                if (name === 'size') root.querySelector('[data-bind="template-size"]').focus();
                return;
            }
            const t = state.templateDraft;
            if (name === 'order') t.discount = value;
            else if (name === 'rate') t.rows.find(row => row.rid === Number(part)).discount = value;
            else t[name] = value;
            t.dirty = true;
            clearMessage('#qt-template-message');
            syncTemplate(true);
            return;
        }
        if (!draft) return;
        draft.dirty = true;
        if (group === 'note') {
            draft.rows.find(row => row.rid === Number(name)).note = value;
            return;
        }
        if (group === 'draft' && name === 'note') { draft.note = value; return; }
        clearMessage('#qt-editor-message');
        if (group === 'customer') draft.customer[name] = value;
        if (group === 'draft') {
            draft[name] = value;
            if (name === 'title') draft.titleTouched = true;
        }
        if (group === 'qty') draft.rows.find(row => row.rid === Number(name)).qty = value;
        if (group === 'order' || group === 'line') {
            const discount = group === 'order' ? draft.discount : draft.rows.find(row => row.rid === Number(name)).discount;
            const attribute = group === 'order' ? name : part;
            discount[attribute] = value;
            if (attribute === 'mode') {
                discount.value = '';
                const bind = input.dataset.bind;
                render();
                root.querySelector(`[data-bind="${bind}"]`)?.focus();
                return;
            }
        }
        syncEditor(input.getAttribute('aria-invalid') === 'true');
    }
    root.addEventListener('input',event => {
        const el = event.target;
        if (el.dataset.bind && el.tagName !== 'SELECT' && ['checkbox','radio'].indexOf(el.type) < 0) bindInput(el);
    });
    root.addEventListener('change',event => {
        const el = event.target;
        if (el.dataset.bind && (el.tagName === 'SELECT' || ['checkbox','radio'].includes(el.type))) bindInput(el);
    });
    root.addEventListener('keydown',event => {
        if (!event.target.matches('.qt-template-tabs [role="tab"]')) return;
        if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
        event.preventDefault();
        const other = event.target.dataset.id === 'personal' ? 'public' : 'personal';
        const scope = event.key === 'Home' ? 'personal' : event.key === 'End' ? 'public' : other;
        root.querySelector(`#qt-template-tab-${scope}`).click();
    });
    dialog.addEventListener('cancel',() => { state.modal = null; });
    dialog.addEventListener('keydown',event => {
        if (event.key !== 'Enter' || event.target.tagName !== 'INPUT' || !['text','search'].includes(event.target.type)) return;
        if (event.target.dataset.bind === 'save-template-name') {
            event.preventDefault();
            commitSaveAs();
        }
    });

    const actions = {
        list:() => navigateSection('list'),
        templates:() => navigateSection('templates','personal'),
        'template-scope':scope => {
            const switching = state.view === 'templates';
            navigateSection('templates',scope);
            if (switching) root.querySelector(`#qt-template-tab-${scope}`).focus({preventScroll:true});
        },
        'reset-quotes':() => { state.quoteFilters = {query:'', start:'', end:'', status:'', page:1, size:state.quoteFilters.size}; render(); },
        'quote-page':id => { state.quoteFilters.page += Number(id); refreshResults('#qt-quote-results',quoteResults); },
        'template-page':id => { state.templateFilters[state.scope].page += Number(id); refreshResults('#qt-template-results',templateResults); },
        'picker-page':id => { state.picker.page += Number(id); pickerResults(); },
        new:() => { state.draft = makeDraft(); go('editor'); },
        detail:id => { state.quote = id; go('detail'); },
        edit:id => {
            const quote = quoteBy(id);
            if (!quote || quote.generated) return;
            state.quote = id;
            state.draft = makeFromQuote(quote,'edit');
            go('editor');
        },
        copy:id => copyDialog(quoteBy(id)),
        'confirm-copy':() => {
            const {copy,clear} = state.modal;
            state.quote = copy;
            state.draft = makeFromQuote(quoteBy(copy),'copy',clear);
            state.draft.back = state.view;
            closeDialog();
            go('editor');
        },
        delete:id => {
            const quote = quoteBy(id);
            if (!quote || quote.generated) return;
            const version = quote.version;
            ask('删除报价单？',`将删除「${quote.title}」 ${quote.number}，原单号会保留。`,'确认删除',() => {
                if (quoteBy(id)?.version !== version || quoteBy(id)?.generated) { inform('报价状态已变化，请重新读取后再操作。'); return; }
                quote.deleted = true;
                quote.version++;
                go('list');
                inform('已删除报价单。');
            },'danger');
        },
        'leave-editor':() => leaveQuote(state.draft.back || (state.draft.mode === 'edit' ? 'detail' : 'list')),
        products:() => pickerOpen('quote'),
        'replace-line':id => pickerOpen('quote',id),
        'refresh-line':id => refreshDialog(state.draft.rows.find(row => row.rid === Number(id))),
        'remove-line':id => {
            state.draft.rows = state.draft.rows.filter(row => row.rid !== Number(id));
            state.draft.conflicts = state.draft.conflicts.filter(rid => rid !== Number(id));
            state.draft.dirty = true;
            render();
        },
        'confirm-picker':pickerApply,
        preview:() => attemptQuote(false),
        'save-quote':() => attemptQuote(true),
        'demo-update':() => {
            const row = state.draft.rows.find(row => !row.source && available(sku(row.product.id)));
            const product = sku(row.product.id);
            const [whole,fraction = '00'] = product.price.split('.');
            product.price = `${BigInt(whole) + 10n}.${fraction}`;
            product.skuVersion++;
            product.productVersion++;
            inform(`${product.id} 的参考售价已变为 ${priceText(product.price,product.currency)}。`);
        },
        'view-paper':id => { state.paper = {from:'detail',quote:clone(quoteBy(id)),shot:false}; go('paper'); },
        'paper-back':() => { const view = state.paper.from; state.paper = null; go(view); },
        'paper-shot':() => { state.paper.shot = !state.paper.shot; toast.hidden = true; go('paper'); },
        'template-new':() => makeTemplateDraft(),
        'template-detail':id => { state.template = id; go('template-detail'); },
        'template-edit':id => makeTemplateDraft(id),
        'leave-template':() => leaveTemplate(state.templateDraft.id ? 'template-detail' : 'templates'),
        'template-products':() => pickerOpen('template'),
        'template-replace':id => pickerOpen('template',id),
        'template-remove':id => {
            state.templateDraft.rows = state.templateDraft.rows.filter(row => row.rid !== Number(id));
            state.templateDraft.dirty = true;
            render();
        },
        'save-template':saveTemplate,
        'choose-template':() => chooseTemplate(),
        'choose-scope':chooseTemplate,
        'apply-template':applyTemplate,
        'save-template-dialog':openSaveAs,
        'confirm-save-as':commitSaveAs,
        close:closeDialog,
        confirm:() => { const action = state.modal.action; closeDialog(); action(); }
    };
    root.addEventListener('click',event => {
        const control = event.target.closest('button[data-act]');
        if (!control || control.disabled) return;
        actions[control.dataset.act]?.(control.dataset.id);
    });
    render();
})();
</script>
