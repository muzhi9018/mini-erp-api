  function archivePictures(images) {

  function numeric(value,scale,caption,optional=false,signed=false) {
    const text=String(value??'').trim();
    if(!text && optional) return '';
    const val=text||'0';
    const pattern=signed?/^-?\d{1,14}(\.\d+)?$/:/^\d{1,14}(\.\d+)?$/;
    if(!pattern.test(val)) throw Error(caption+(signed?'须为数字，最多 14 位整数。':'须为非负数，最多 14 位整数。'));
    const [whole,part='']=val.split('.');
    if(part.length>scale) throw Error(caption+'最多允许 '+scale+' 位小数。');
    const trimmed=whole.replace(/^(-?)0+(?=\d)/,'$1');
    return trimmed+(part?'.'+part:'');
  }
  const numericKey = v => String(v).replace(/(\.\d*?[1-9])0+$/,'$1').replace(/\.0+$/,'').replace(/^-0$/,'0');
  const order = v => {

    if(!/^\d+$/.test(n)||Number(n)>2147483647) throw Error('排序必须是 0 至 2147483647 之间的整数。');
    return Number(n);
  };
  const requiredText=(v,label)=>{const t=String(v??'').trim(); if(!t)throw Error('请填写'+label+'。'); return t;};
  const newCode=(v,type,labelText,seen=usedCodes[type])=>{
    const code=requiredText(v,labelText);
    if(seen.has(code)) throw Error(labelText+'「'+code+'」已使用。');
    return code;
  };
  function validateBasics(obj,creating) {
    return {name:requiredText(obj.name,'商品名称'),code:creating?newCode(obj.code,'product','商品编码'):obj.code,

      description:String(obj.description||'').trim(),status:obj.status,sort:order(obj.sort)};
  }
  function validateDimensions(dims) {
    const names=new Set();
    return dims.map(d=>{
      const name=requiredText(d.name,'维度名称');
      if(names.has(name)) throw Error('规格维度「'+name+'」重复。');
      names.add(name);
      const unique=new Set();
      const tokens=String(d.tokens||'').split(/[,，、\n]/).map(v=>v.trim()).filter(Boolean);
      if(!tokens.length) throw Error('请为「'+name+'」添加候选值。');
      const values=tokens.map((token,i)=>{
        const value=d.type==='NUMBER'?numericKey(numeric(token,6,'「'+name+'」的候选值',false,true)):token;
        if(unique.has(value)) throw Error('「'+name+'」中的候选值「'+value+'」重复。');
        unique.add(value);
        return {id:d.id+'-'+value,value,sort:i};
      });
      return {...d,name,sort:order(d.sort),unitId:d.type==='NUMBER'?d.unitId:'',values};
    });

  function validateSkuList(p,drafts,existing=[]) {
    const selected=drafts.filter(s=>s.selected);

    const codes=new Set(usedCodes.sku);
    const combos=new Set(existing.map(s=>comboKey(s.picks)));
    return selected.map(s=>{
      const caption=specText(p,s);
      const code=newCode(s.code,'sku','SKU 货号',codes);
      codes.add(code);
      const u=unit(s.unitId);
      if(!u) throw Error('请为「'+code+'」选择计量单位。');
      const key=comboKey(s.picks);
      if(combos.has(key)) throw Error('规格组合「'+caption+'」已存在。');
      combos.add(key);
      const priceValues=validatePrices(s,'「'+code+'」的');
      const saved=sku(s.id,code,String(s.model||'').trim(),u.id,numeric(s.stock,u.scale,'「'+code+'」的库存'),

      if(d.mode==='multi') d.dimensions=validateDimensions(d.dimensions);
      const choices=combinations(d.mode==='multi'?d.dimensions:[]);
      const drafted=new Map(d.skus.map(s=>[comboKey(s.picks),s]));

        if(d.type==='NUMBER'&&c) {
          if(c.minimum?.trim()) numeric(c.minimum,6,d.name+'最小值',false,true);
          if(c.maximum?.trim()) numeric(c.maximum,6,d.name+'最大值',false,true);
          if(c.minimum?.trim()&&c.maximum?.trim()&&Number(c.minimum)>Number(c.maximum)) throw Error(d.name+'最小值不能大于最大值。');
        }
      }

    const results=error?[]:ordered(products).flatMap(p=>

        if(s.status!=='ENABLED'||![p.name,p.code,s.code,s.model].some(v=>matches(v,f.query))) return false;

          const c=f.criteria[d.id];

  function applyCatalogEdits(form) {
    const f=modal;
    const formData=valueForm(form);
    switch(f.type) {
      case 'confirm':
        if(f.submit) f.apply?.();
        return;
      case 'category-new': case 'category-edit': {
        const edited=f.type==='category-edit';
        const c=f.c;
        const name=requiredText(formData.name,'分类名称');
        if(categories.some(s=>s.parent===c.parent&&s.name===name&&s.id!==c.id)) throw Error('同级分类已使用此名称。');
        const code=edited?c.code:newCode(formData.code,'category','分类编码');
        const next=cat(c.id,c.parent,code,name,order(formData.sort),String(formData.description||'').trim());
        if(edited) {
          if(c.name!==name) products.filter(p=>under(p.catId,c.id)).forEach(p=>bump(p));
          categories=categories.map(s=>s.id===c.id?next:s);
        } else {
          usedCodes.category.add(code);
          categories.push(next);
        }
        state.catId=c.id;
        state.collapsed.delete(c.parent);
        finish(edited?'已保存分类。':'已新增分类。');
        return;
      }
      case 'unit-new': case 'unit-edit': {
        const u=f.u;
        const edited=f.type==='unit-edit';
        const name=requiredText(formData.name,'单位名称');
        if(units.some(s=>s.name===name&&s.id!==u.id)) throw Error('单位名称「'+name+'」已使用。');
        const code=edited?u.code:newCode(formData.code,'unit','单位编码');
        const next={id:u.id, name, code, sort:order(formData.sort), scale:Number(formData.scale??u.scale)};
        if(edited) {
          if(u.name!==name) products.filter(p=>p.skus.some(s=>s.unitId===u.id)||p.dimensions.some(d=>d.unitId===u.id)).forEach(p=>bump(p));
          units=units.map(s=>s.id===u.id?next:s);
        } else {
          usedCodes.unit.add(code);
          units.push(next);
        }
        finish(edited?'已保存计量单位。':'已新增计量单位。');
        return;
      }
      case 'product-edit': {
        const p=f.p;
        productVersion(p,f.expected);
        const result=validateBasics({...p,...formData},false);
        Object.assign(p,result);
        bump(p);
        finish('商品资料已保存 · V'+p.version);
        return;
      }
      case 'images-edit': {
        productVersion(f.p,f.expected);
        f.p.images=copy(normalCover(f.images));
        bump(f.p);
        finish('图片已保存 · V'+f.p.version);
        return;
      }
      case 'sku-images-edit': {
        const {p,s,expected,images}=f;
        if(s.version!==expected) throw Error('SKU 版本已变化。请重新打开图片编辑窗口。');
        s.images=copy(normalCover(images));
        bump(p,s);
        finish('SKU 图片已保存 · SKU V'+s.version+' · 商品 V'+p.version);
        return;
      }
      case 'dimension-new': case 'dimension-edit': {
        productVersion(f.p,f.expected);
        const name=requiredText(formData.name,'维度名称');
        if(f.p.dimensions.some(d=>d.id!==f.d.id&&d.name===name)) throw Error('此商品已使用该维度名称。');
        if(f.type==='dimension-edit') {
          const sort=order(formData.sort);
          Object.assign(f.d,{name,sort});
        } else {
          if(f.p.skus.length||businessUsed(f.p)) throw Error('此商品的维度结构已锁定。');
          const [next]=validateDimensions([{...f.d,...formData,name}]);
          f.p.dimensions.push(next);
        }
        bump(f.p);
        finish('规格维度已保存 · V'+f.p.version);
        return;
      }
      case 'value-new': case 'value-edit': {
        productVersion(f.p,f.expected);
        if(f.type==='value-edit'&&!Object.hasOwn(formData,'value')) {
          f.v.sort=order(formData.sort);
        } else {
          const raw=requiredText(formData.value,'候选值');
          const value=f.d.type==='NUMBER'?numericKey(numeric(raw,6,'候选值',false,true)):raw;
          if(f.d.values.some(v=>v.id!==f.v.id&&v.value===value)) throw Error('「'+f.d.name+'」已存在候选值「'+value+'」。');
          const next={id:f.v.id,value,sort:order(formData.sort)};
          if(f.type==='value-edit') Object.assign(f.v,next);
          else f.d.values.push(next);
        }
        bump(f.p);
        finish('候选值已保存 · V'+f.p.version);
        return;
      }
      case 'sku-edit': {
        const {p,s,expected}=f;
        if(s.version!==expected) throw Error('SKU 版本已变化。请重新打开编辑窗口。');
        const unitId=formData.unitId??s.unitId;
        if(!unit(unitId)) throw Error('请选择计量单位。');
        const sort=order(formData.sort);
        const priceValues=validatePrices(formData);
        Object.assign(s,{model:formData.model.trim(),unitId,sort,...priceValues});
        bump(p,s);
        finish('SKU 资料已保存 · 商品 V'+p.version);
        return;
      }
      case 'sku-new': {
        if(!f.drafts) {
          const combos=new Set(f.p.skus.map(s=>comboKey(s.picks)));
          const previous=new Map((f.previous||[]).map(s=>[comboKey(s.picks),s]));
          f.error='';
          f.drafts=combinations(f.p.dimensions,f.chosen).filter(c=>!combos.has(comboKey(c))).map(c=>previous.get(comboKey(c))||draftSku(c));
          if(f.drafts.length===1) f.drafts[0].selected=true;
          drawModal();
          return;
        }
        productVersion(f.p,f.expected);
        const added=validateSkuList(f.p,f.drafts,f.p.skus);
        added.forEach(s=>usedCodes.sku.add(s.code));
        f.p.skus.push(...added);
        bump(f.p);
        finish('已新增 '+added.length+' 条 SKU · 商品 V'+f.p.version);
        return;
      }
      case 'stock': {
        const {p,s,expected}=f;
        if(s.version!==expected) {
          f.conflict=true;
          drawModal();
          return;
        }
        if(f.conflict)return;
        const target=requiredText(f.target,'目标库存');
        s.stock=numeric(target,unit(s.unitId).scale,'目标库存');
        bump(p,s);
        finish('库存已设置为 '+s.stock+' '+unit(s.unitId).name+' · SKU V'+s.version);
        return;
      }
      case 'pick-confirm': {
        const {p,s,expected,expectedSku}=f;
        if(p.version!==expected||s.version!==expectedSku||p.status!=='ENABLED'||s.status!=='ENABLED') throw Error('商品或 SKU 已更新，请返回重新选品。');
        const q=numeric(requiredText(formData.quantity,'数量'),unit(s.unitId).scale,'数量');
        if(Number(q)===0) throw Error('数量须大于 0。');
        const price=numeric(requiredText(formData.price,'成交单价'),6,'成交单价');
        const identity=s.id+'/'+p.version;
        let sn=snapshotBook.get(identity);
        const reused=!!sn;
        if(!sn) {
          sn=snapshotFor(p,s,'SP-'+(1001+snapshotBook.size));
          snapshotBook.set(identity,sn);
        }
        state.quote={key:sn.id,quantity:q,price,currency:quoteCurrency};
        finish((reused?'已复用':'已生成')+'商品快照 '+sn.id+' · V'+sn.version);
        return;
      }
    }
  }

  function imageContext(element) {

    if(draft) {
      const drafts=modal?.type==='sku-new'?modal.drafts:state.draft?.skus;
      const s=drafts?.find(s=>s.id===draft.dataset.skuGallery);
      return s?{editor,draft,images:s.images}:null;
    }
    if(['images-edit','sku-images-edit'].includes(modal?.type)) return {editor,images:modal.images};
    if(state.page==='new'&&state.step===0) return {editor,images:state.draft.images};
    return null;

  function refreshImageEditor({editor,draft,images}) {
    if(!modal) state.draft.dirty=true;
    editor.querySelector('.pd-editable-gallery').innerHTML=gallery(images,true);
    editor.querySelector('[data-action="image-clear"]').hidden=images.length===0;
    if(draft) draft.querySelector('.pd-draft-image-count').textContent=images.length?' · '+images.length+' 张':'（选填）';

  function moveImage(context,from,to) {
    const {images}=context;
    if(from<0||to<0||from>=images.length||to>=images.length||from===to) return;
    const [selected]=images.splice(from,1);
    images.splice(to,0,selected);
    refreshImageEditor(context);
  }
  function uploadFiles(input) {
    const context=imageContext(input);
    if(!context)return;
    const {images}=context;
    let invalid=false;
    for(const file of input.files) {
      if(!/^(image\/(jpeg|png|webp|gif|avif|bmp|x-ms-bmp))$/i.test(file.type)) {invalid=true;continue;}
      const key=[file.name,file.size,file.lastModified].join(':');
      if(images.some(img=>img.key===key))continue;
      images.push({id:id(),src:URL.createObjectURL(file),key,cover:false});
    }
    input.value='';
    normalCover(images);
    refreshImageEditor(context);
    if(invalid) {
      const el=root.querySelector(modal?'#pd-modal-error':'#pd-wizard-error');
      errorMessage(el,'其他文件已跳过。请选择 JPEG、PNG、WebP、GIF、AVIF 或 BMP 图片。');

      return;
    }
    ask('删除商品？',`<p>将删除「${safe(p.name)}」及其 SKU、规格和图片关联。已保存的单据资料继续保留。</p>`,()=>{
      products=products.filter(x=>x.id!==p.id);
      go('catalog');
      notify('已删除商品。');
    },{submit:'确认删除商品',danger:true});
  }
  function categoryDelete(c) {
    if(categories.some(x=>x.parent===c.id)||products.some(p=>p.catId===c.id)) {
      block('此分类仍在使用',`<div class="pd-warn">「${safe(c.name)}」下仍有子分类或商品，请先处理关联记录。</div>`);
      return;
    }
    ask('删除分类？',`<p>确认删除空分类「${safe(c.name)}」？</p>`,()=>{
      categories=categories.filter(s=>s.id!==c.id);
      state.catId=c.parent;
      finish('已删除分类。');
    },{submit:'确认删除',danger:true});
  }
  function unitDelete(u) {
    const refs=unitReferences(u);
    if(refs.sku||refs.spec) {
      block('此单位仍在使用',`<div class="pd-warn">「${safe(u.name)}」被 ${refs.sku} 条 SKU 和 ${refs.spec} 个规格引用。</div>`);
      return;
    }
    ask('删除计量单位？',`<p>确认删除「${safe(u.name)}」？</p>`,()=>{
      units=units.filter(s=>s.id!==u.id);
      finish('已删除计量单位。');
    },{submit:'确认删除',danger:true});
  }
  function skuDelete(p,s) {
    if(Number(s.stock)>0) {
      block('暂时无法删除 SKU',`<div class="pd-warn">${safe(s.code)} 的当前库存为 ${showStock(s)}。请先将库存设置为 0。</div>${action('去设置库存','stock',{kind:'pd-primary',attrs:data('key',s.id)+' '+data('pid',p.id)})}`);
      return;
    }
    ask('删除 SKU？',`<p>确认删除「${safe(s.code)}」？历史单据中的商品资料继续保留。</p>`,()=>{
      p.skus=p.skus.filter(x=>x!==s);
      bump(p);
      finish('已删除 SKU · 商品 V'+p.version);
    },{submit:'确认删除 SKU',danger:true});
  }
  function commit() {
    const wizard=!modal&&state.page==='new';
    const form=root.querySelector(wizard?'#pd-wizard':'#pd-modal-form');
    if(!form)return;
    try {
      if(wizard) wizardSubmit();
      else applyCatalogEdits(form);
    } catch(e) {
      if(!wizard&&modal) modal.error=e.message;
      errorMessage(root.querySelector(wizard?'#pd-wizard-error':'#pd-modal-error'),e.message);
    }
  }
  root.addEventListener('keydown',event=>{
    if(event.key!=='Enter'||event.isComposing||event.target.tagName!=='INPUT')return;
    if(!event.target.form||['file','checkbox','radio','search'].includes(event.target.type))return;
    const save=(modal?dialog:work).querySelector('[data-action="commit"]');
    if(save) {event.preventDefault();commit();}
  });
  function syncDraftInput(el,drafts) {
    const item=drafts?.find(s=>s.id===el.dataset.draftSku);
    if(!item)return;
    item[el.name]=el.type==='checkbox'?el.checked:el.value;
    if(el.name==='selected') {
      root.querySelector('[data-sku-fields="'+item.id+'"]').hidden=!item.selected;
      const count=root.querySelector(modal?'#pd-batch-count':'#pd-wizard-count');
      if(count) count.textContent=drafts.filter(s=>s.selected).length;
    }
  }
  function input(event) {
    const el=event.target;
    const priceGroup=el.closest('.pd-price-group');
    if(priceGroup) {
      priceGroup.querySelector('[data-action="clear-price"]').disabled=![...priceGroup.querySelectorAll('input,select')].some(input=>input.value!=='');
    }
    const drafts=modal?.type==='sku-new'?modal.drafts:state.page==='new'?state.draft.skus:null;
    if(el.dataset.draftSku) return syncDraftInput(el,drafts);
    if(modal?.type==='stock'&&el.name==='target') {modal.target=el.value;return;}
    if(modal?.type==='picker') {
      const f=modal.picker;
      if(el.name==='pickerQuery'){f.query=el.value;pickerResults();}
      if(el.dataset.filterDim){
        const d=el.dataset.filterDim;
        f.criteria[d]??={};
        f.criteria[d][el.name]=el.value;
        pickerResults();
      }
      return;
    }
    if(state.page==='catalog'&&el.name==='catalogQuery') {state.query=el.value;state.pageNum=1;renderProductResults();return;}
    if(state.page==='units'&&el.name==='unitQuery') {state.unitQuery=el.value;renderUnits();return;}
    if(!modal&&state.page==='new'&&el.name) {
      const d=state.draft;
      if(el.dataset.dim) {
        const entry=d.dimensions.find(x=>x.id===el.dataset.dim);
        if(entry && el.name!=='type') entry[el.name]=el.value;
      } else if(state.step===0&&Object.hasOwn(d,el.name)&&el.type!=='file') d[el.name]=el.value;
      if(el.type!=='file') d.dirty=true;
    }
  }
  root.addEventListener('input',input);
  root.addEventListener('change',event=>{
    const el=event.target;
    if(el.name==='images') return uploadFiles(el);
    if(el.name==='catalogCategory') {state.category=el.value;state.pageNum=1;renderProductResults();return;}
    if(el.name==='pageSize') {state.pageSize=Number(el.value);state.pageNum=1;renderProductResults();return;}
    if(modal?.type==='picker'&&['pickerProduct','pickerCategory'].includes(el.name)) {
      const f=modal.picker;
      if(el.name==='pickerCategory') {f.category=el.value;f.pid='';}
      else f.pid=el.value;
      f.criteria={};
      drawModal();
      const select=dialog.querySelector('select[name="'+el.name+'"]');
      select?.focus();
      return;
    }
    if(modal?.type==='sku-new'&&el.name==='buildValue') {
      const d=el.dataset.dim;
      const list=new Set(modal.chosen[d]);
      if(el.checked)list.add(el.value);
      else list.delete(el.value);
      modal.chosen[d]=[...list];
      return;
    }
    if(modal?.type==='dimension-new'&&el.name==='type') {
      const values=valueForm(el.form);
      Object.assign(modal.d,values,{unitId:''});
      drawModal();
      return;
    }
    if(!modal&&state.page==='new') {
      if(el.name==='specMode') {state.draft.mode=el.value;state.draft.dirty=true;render();}
      if(el.name==='type'&&el.dataset.dim) {
        const d=state.draft.dimensions.find(x=>x.id===el.dataset.dim);
        d.type=el.value;
        d.unitId='';
        render();
      }
    }
  });
  dialog.addEventListener('cancel',event=>{
    event.preventDefault();
    const simulated=modal?.type==='stock'&&modal.simulated;
    closeModal();
    if(simulated)render();
  });
  root.addEventListener('dragstart',event=>{
    const card=event.target.closest('.pd-imagecard[draggable]');
    const context=card&&imageContext(card);
    if(!context)return;
    dragged={editor:context.editor,index:Number(card.dataset.image)};
    event.dataTransfer.setData('text/plain',card.dataset.image);
    event.dataTransfer.effectAllowed='move';
  });
  root.addEventListener('dragover',event=>{
    if(dragged&&event.target.closest('.pd-imagecard[draggable]')?.closest('.pd-image-editor')===dragged.editor)event.preventDefault();
  });
  root.addEventListener('drop',event=>{
    const card=event.target.closest('.pd-imagecard[draggable]');
    const context=card&&imageContext(card);
    if(!dragged||!context||context.editor!==dragged.editor)return;
    event.preventDefault();
    moveImage(context,dragged.index,Number(card.dataset.image));
    dragged=null;
  });
  root.addEventListener('dragend',()=>{dragged=null;});
  root.addEventListener('toggle',event=>{
    const details=event.target;
    const pid=details.dataset.specsProduct;
    if(!pid||!details.isConnected)return;
    if(details.open) state.expandedSpecs.add(pid);
    else state.expandedSpecs.delete(pid);
  },true);
  root.addEventListener('click',event=>{
    const button=event.target.closest('button[data-action]');
    if(!button||!root.contains(button))return;
    const {action:cmd,key,val,pid}=button.dataset;
    const p=pid?getProduct(pid):modal?.p||current();
    const s=getSku(p,key);
    switch(cmd) {
      case 'commit': return commit();
      case 'nav': return go(key);
      case 'module-fold':
        state.menuExpanded=!state.menuExpanded;
        renderSidebar();
        sidebar.querySelector('[data-action="module-fold"]').focus();
        icons();
        return;
      case 'new': return createDraft();
      case 'leave-new': return go('catalog');
      case 'open': return detail(key);
      case 'expand-skus': {
        const expanded=state.expandedProducts;
        if(expanded.has(key)) expanded.delete(key);
        else expanded.add(key);
        renderProductResults();
        work.querySelector(`[data-action="expand-skus"][data-key="${key}"]`)?.focus({preventScroll:true});
        return;
      }
      case 'clear-price': {
        for(const input of button.closest('fieldset').querySelectorAll('input,select')) {
          input.value='';
          input.dispatchEvent(new Event('input',{bubbles:true}));
        }
        button.disabled=true;
        return;
      }
      case 'hide-toast': toast.hidden=true;return;
      case 'filter-status': state.status=key;state.pageNum=1;render();return;
      case 'reset': state.query='';state.category='';state.status='';state.pageNum=1;render();return;
      case 'pager': state.pageNum+=Number(key);renderProductResults();return;
      case 'category-select': state.catId=key;render();return;
      case 'category-fold':
        if(state.collapsed.has(key)) state.collapsed.delete(key);
        else state.collapsed.add(key);
        categoryView();
        icons();
        return;
      case 'category-products': state.category=key;state.query='';state.status='';state.pageNum=1;go('catalog');return;
      case 'category-edit': return openModal(cmd,{c:category(key)});
      case 'category-new': return openModal(cmd,{c:cat(id(),key||'','','',0)});
      case 'category-del': return categoryDelete(category(key));
      case 'unit-new': return openModal(cmd,{u:{id:id(),code:'',name:'',scale:0,sort:0}});
      case 'unit-edit': return openModal(cmd,{u:unit(key)});
      case 'unit-del': return unitDelete(unit(key));
      case 'close': {
        const simulated=modal?.type==='stock'&&modal.simulated;
        closeModal();
        if(simulated)render();
        return;
      }
      case 'product-menu': return openModal(cmd,{p});
      case 'product-edit': return openModal(cmd,{p,expected:p.version});
      case 'images-edit': return openModal(cmd,{p,images:copy(p.images),expected:p.version});
      case 'product-status': {
        const enabled=p.status==='ENABLED';
        const next=enabled?'停用':'启用';
        return ask(next+'商品？',`<p>「${safe(p.name)}」${enabled?'及旗下 SKU 将从选品结果移除。再次启用后会沿用各 SKU 原有状态。':'启用后，状态为启用的 SKU 会重新出现在选品结果。'}</p>`,()=>{
          p.status=enabled?'DISABLED':'ENABLED';
          bump(p);
          finish('商品已'+next+' · V'+p.version);
        },{submit:'确认'+next});
      }
      case 'product-delete': return removableProduct(p);
      case 'dimension-new': return openModal(cmd,{p,d:{id:id(),name:'',type:'TEXT',unitId:'',sort:0,tokens:''},expected:p.version});
      case 'dimension-edit': return openModal(cmd,{p,d:p.dimensions.find(d=>d.id===key),expected:p.version});
      case 'dimension-delete': {
        const {d}=modal;
        return ask('删除规格维度？',`<p>确认删除「${safe(d.name)}」及其未被引用的候选值？</p>`,()=>{
          p.dimensions=p.dimensions.filter(x=>x!==d);bump(p);finish('已删除规格维度 · V'+p.version);
        },{submit:'确认删除',danger:true});
      }
      case 'value-new': return openModal(cmd,{p,d:p.dimensions.find(d=>d.id===key),v:{id:id(),value:'',sort:0},expected:p.version});
      case 'value-edit': {
        const d=p.dimensions.find(d=>d.id===key);
        return openModal(cmd,{p,d,v:d.values.find(v=>v.id===val),expected:p.version});
      }
      case 'value-delete': {
        const {d,v}=modal;
        return ask('删除候选值？',`<p>确认删除「${safe(d.name)} · ${safe(v.value)}」？</p>`,()=>{
          d.values=d.values.filter(x=>x!==v);bump(p);finish('已删除候选值 · V'+p.version);
        },{submit:'确认删除',danger:true});
      }
      case 'sku-menu': case 'sku-images': return openModal(cmd,{p,s});
      case 'sku-edit': return openModal(cmd,{p,s,expected:s.version});
      case 'sku-images-edit': return openModal(cmd,{p,s,images:copy(s.images),expected:s.version});
      case 'sku-new': {
        const chosen=Object.fromEntries(p.dimensions.map(d=>[d.id,d.values.map(v=>v.id)]));
        return openModal(cmd,{p,chosen,drafts:null,expected:p.version});
      }
      case 'batch-back': modal.previous=modal.drafts;modal.drafts=null;modal.error='';drawModal();return;
      case 'sku-status': {
        const enabled=s.status==='ENABLED';
        const next=enabled?'停用':'启用';
        return ask(next+' SKU？',`<p><span class="pd-mono">${safe(s.code)}</span> ${enabled?'停用后将从可选商品中移除，规格组合仍保留。':'启用后，所属商品也处于启用时才可选用。'}</p>`,()=>{
          s.status=enabled?'DISABLED':'ENABLED';bump(p,s);finish('SKU 已'+next+' · 商品 V'+p.version);
        },{submit:'确认'+next});
      }
      case 'sku-delete': return skuDelete(p,s);
      case 'stock': return openModal(cmd,{p,s,base:s.stock,expected:s.version,target:'',conflict:false,reloaded:false,simulated:false});
      case 'stock-conflict':
        modal.s.stock=Number(modal.s.stock)===0?'1':'0';
        bump(modal.p,modal.s);
        modal.simulated=true;
        modal.error='';
        modal.conflict=true;
        drawModal();
        return;
      case 'stock-refresh':
        modal.expected=modal.s.version;
        modal.base=modal.s.stock;
        modal.reloaded=true;
        modal.conflict=false;
        modal.error='';
        drawModal();
        return;
      case 'wizard-prev': state.step--;render();showPageStart();return;
      case 'draft-dim-add':
        state.draft.dimensions.push({id:id(),name:'',type:'TEXT',unitId:'',tokens:'',sort:state.draft.dimensions.length});
        state.draft.dirty=true;
        render();
        return;
      case 'preset-specs':
        state.draft.dimensions=[{id:id(),name:'颜色',type:'TEXT',unitId:'',tokens:'灰色、白色',sort:0},{id:id(),name:'宽度',type:'NUMBER',unitId:'mm',tokens:'900、1200',sort:1}];
        state.draft.dirty=true;
        render();
        return;
      case 'draft-dim-remove': state.draft.dimensions=state.draft.dimensions.filter(d=>d.id!==key);render();return;
      case 'draft-select-all': case 'draft-select-none':
        state.draft.skus.forEach(s=>{s.selected=cmd==='draft-select-all';});
        render();
        return;
      case 'image-preview': {
        const source=button.dataset.source;
        let images=p?.images;
        let back=null;
        if(modal?.type==='snapshot') {
          const {sn}=modal;
          images=source==='sku'?sn.skuImages:sn.productImages;
          back={type:'snapshot',details:{sn},label:'返回历史资料'};
        } else if(modal?.type==='sku-images') {
          const {p,s}=modal;
          images=source==='sku'?s.images:[cover(p.images)];
          back={type:'sku-images',details:{p,s},label:'返回 SKU 图片'};
        }
        return openModal(cmd,{images,index:Number(button.dataset.image),back});
      }
      case 'image-preview-step':
        modal.index+=Number(key);
        drawModal();
        return;
      case 'image-preview-back': return openModal(modal.back.type,modal.back.details);
      case 'image-move': {
        const index=Number(button.dataset.image);
        return moveImage(imageContext(button),index,index+Number(button.dataset.delta));
      }
      case 'image-cover': case 'image-remove': case 'image-clear': {
        const context=imageContext(button);
        if(!context)return;
        const {images}=context;
        const index=Number(button.dataset.image);
        if(cmd==='image-cover') images.forEach((img,i)=>{img.cover=i===index;});
        if(cmd==='image-remove') images.splice(index,1);
        if(cmd==='image-clear') images.length=0;
        normalCover(images);
        return refreshImageEditor(context);
      }
      case 'picker': return openModal(cmd,{picker:{query:'',category:'',pid:'',criteria:{}}});
      case 'picker-back': return openModal('picker',{picker:modal.picker});
      case 'pick': {
        const selected=getProduct(pid);
        return pickConfirm(selected,getSku(selected,key),modal.picker);
      }
      case 'snapshot': return openModal(cmd,{sn:[...snapshotBook.values()].find(sn=>sn.id===key)});
    }
  });
  render();
})();
</script>
