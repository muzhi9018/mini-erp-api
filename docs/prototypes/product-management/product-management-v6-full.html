  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;

  );

  initialStateElement?.remove();

  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }

      },

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      modelContent: null,
      privateContent: null,
      ...parsedState,

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(

      }

    if (fileElement != null) {

      fileElement.remove();
      const blobs = new Map();
      const urls = [];

      get bindings() {

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

        ),
      ),

  };

    &quot;message&quot;,
    (event) =&gt; {

      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||

        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

                if (data.ok === true) {

                } else {

                }

        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;

    { capture: true },
  );

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

      return;
    }

        id = decodeURIComponent(href.slice(1));

        return;
      }

      });
      return;
    }

  });

      tools=action(&#x27;取消新增&#x27;,&#x27;leave-new&#x27;,{glyph:&#x27;x&#x27;});
      tabs=`&lt;ol class=&quot;pd-steps&quot; aria-label=&quot;创建步骤&quot;&gt;${[&#x27;基本资料与图片&#x27;,&#x27;规格与组合&#x27;,&#x27;填写 SKU&#x27;].map((name,i)=&gt;`&lt;li class=&quot;pd-step&quot; ${i===state.step?&#x27;aria-current=&quot;step&quot;&#x27;:i&lt;state.step?&#x27;data-complete&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${i&lt;state.step?&#x27;✓&#x27;:i+1}&lt;/span&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;`;
    }
    if(state.page===&#x27;quote&#x27;) {
      title=&#x27;单据选品演示&#x27;; subtitle=&#x27;用示例报价验证当前 SKU 与历史商品资料的展示。&#x27;;
      tools=action(&#x27;选择商品&#x27;,&#x27;picker&#x27;,{kind:&#x27;pd-primary&#x27;,glyph:&#x27;plus&#x27;});
    }
    head.innerHTML=`&lt;div class=&quot;pd-crumb&quot; aria-label=&quot;当前位置&quot;&gt;${icon(&#x27;boxes&#x27;)}${trail}&lt;/div&gt;
      &lt;div class=&quot;pd-headline&quot;&gt;&lt;div&gt;&lt;div class=&quot;pd-headtitle&quot;&gt;&lt;div&gt;&lt;div class=&quot;pd-row&quot;&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;/div&gt;&lt;p class=&quot;pd-subtitle&quot;&gt;${subtitle}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pd-row&quot;&gt;${tools}&lt;/div&gt;&lt;/div&gt;${tabs}`;
  }
  function searchField(name,value,placeholder) {
    return `&lt;label class=&quot;pd-search&quot;&gt;${icon(&#x27;search&#x27;)}&lt;input type=&quot;search&quot; class=&quot;pd-search-input&quot; name=&quot;${name}&quot; value=&quot;${safe(value)}&quot; aria-label=&quot;${placeholder}&quot; placeholder=&quot;${placeholder}&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;`;
  }
  function productList() {
    const counts = {&#x27;&#x27;:products.length,ENABLED:0,DISABLED:0};
    products.forEach(p=&gt;counts[p.status]++);
    const statusSelect = [[&#x27;&#x27;,&#x27;全部商品&#x27;],[&#x27;ENABLED&#x27;,&#x27;已启用&#x27;],[&#x27;DISABLED&#x27;,&#x27;已停用&#x27;]].map(([k,v])=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;filter-status&quot; ${data(&#x27;key&#x27;,k)} aria-pressed=&quot;${state.status===k}&quot;&gt;${v} &lt;span class=&quot;pd-count&quot;&gt;${counts[k]}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
    work.innerHTML=`&lt;div class=&quot;pd-panel&quot; aria-label=&quot;商品列表&quot;&gt;&lt;div class=&quot;pd-statusbar&quot; aria-label=&quot;按商品状态筛选&quot;&gt;${statusSelect}${action(&#x27;单据选品演示&#x27;,&#x27;nav&#x27;,{kind:&#x27;pd-quiet pd-previewlink&#x27;,glyph:&#x27;external-link&#x27;,attrs:data(&#x27;key&#x27;,&#x27;quote&#x27;)})}&lt;/div&gt;&lt;div class=&quot;pd-filters&quot;&gt;
        ${searchField(&#x27;catalogQuery&#x27;,state.query,&#x27;搜索商品名称、编码、货号或型号&#x27;)}
        ${select(&#x27;catalogCategory&#x27;,catOptions(&#x27;全部分类&#x27;),state.category,&#x27;aria-label=&quot;筛选商品分类&quot;&#x27;)}
        ${action(&#x27;清除筛选&#x27;,&#x27;reset&#x27;,{kind:&#x27;pd-quiet&#x27;,glyph:&#x27;rotate-ccw&#x27;})}
      &lt;/div&gt;&lt;div id=&quot;pd-results&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
    renderProductResults();
  }
  function renderProductResults() {
    const filtered = ordered(products.filter(p =&gt;
      (!state.status || p.status===state.status) &amp;&amp; under(p.catId,state.category) &amp;&amp;
      ([p.name,p.code,...p.skus.flatMap(s=&gt;[s.code,s.model])].some(v=&gt;matches(v,state.query)))
    ));
    const pageCount=Math.max(1,Math.ceil(filtered.length/state.pageSize));
    state.pageNum=Math.min(state.pageNum,pageCount);
    const start=(state.pageNum-1)*state.pageSize;
    const rows=filtered.slice(start,start+state.pageSize).map(p=&gt;{
      const expanded=state.expandedProducts.has(p.id);
      const innerId=&#x27;pd-child-&#x27;+p.id;
      const expand=p.skus.length?action(&#x27;&#x27;,&#x27;expand-skus&#x27;,{
        kind:&#x27;pd-quiet pd-icon pd-sku-toggle&#x27;,glyph:expanded?&#x27;chevron-down&#x27;:&#x27;chevron-right&#x27;,
        attrs:data(&#x27;key&#x27;,p.id)+` aria-expanded=&quot;${expanded}&quot; aria-controls=&quot;${innerId}&quot; aria-label=&quot;${expanded?&#x27;收起&#x27;:&#x27;展开&#x27;} ${safe(p.name)} 的 ${p.skus.length} 条 SKU&quot;`
      }):&#x27;&#x27;;
      return `&lt;tr class=&quot;${expanded?&#x27;pd-catalog-open&#x27;:&#x27;&#x27;}&quot;&gt;
      &lt;td class=&quot;pd-expand-col&quot;&gt;${expand}&lt;/td&gt;
      &lt;td&gt;&lt;div class=&quot;pd-product&quot;&gt;${thumb(cover(p.images))}&lt;div&gt;&lt;button class=&quot;pd-product-name&quot; type=&quot;button&quot; data-action=&quot;open&quot; ${data(&#x27;key&#x27;,p.id)}&gt;${safe(p.name)}&lt;/button&gt;&lt;div class=&quot;pd-mono pd-muted&quot;&gt;${safe(p.code)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/td&gt;
      &lt;td class=&quot;pd-tertiary-col&quot;&gt;${safe(catPath(p.catId))}&lt;/td&gt;&lt;td class=&quot;pd-tabular&quot;&gt;${p.skus.length}&lt;/td&gt;
      &lt;td&gt;${badge(p.status)}&lt;/td&gt;&lt;td class=&quot;pd-secondary-col&quot;&gt;${timestamp(p.updated)}&lt;/td&gt;
      &lt;td class=&quot;pd-right pd-smallhide&quot;&gt;${action(&#x27;查看详情&#x27;,&#x27;open&#x27;,{kind:&#x27;pd-quiet&#x27;,glyph:&#x27;chevron-right&#x27;,attrs:data(&#x27;key&#x27;,p.id)+&#x27; aria-label=&quot;查看详情 &#x27;+safe(p.name)+&#x27;&quot;&#x27;})}&lt;/td&gt;&lt;/tr&gt;
      ${p.skus.length?`&lt;tr id=&quot;${innerId}&quot; class=&quot;pd-sku-child&quot; ${expanded?&#x27;&#x27;:&#x27;hidden&#x27;}&gt;
        &lt;td class=&quot;pd-expand-col&quot;&gt;&lt;/td&gt;&lt;td class=&quot;pd-sku-child-content&quot; colspan=&quot;6&quot;&gt;${expanded?`&lt;section class=&quot;pd-sku-child-panel&quot; aria-label=&quot;${safe(p.name)}的 SKU 子列表&quot;&gt;${skuTable(p)}&lt;/section&gt;`:&#x27;&#x27;}&lt;/td&gt;
      &lt;/tr&gt;`:&#x27;&#x27;}`;
    }).join(&#x27;&#x27;);
    const footer=`&lt;div class=&quot;pd-pagination pd-row pd-between&quot;&gt;&lt;span role=&quot;status&quot;&gt;共 ${filtered.length} 条${filtered.length?&#x27; · &#x27;+(start+1)+&#x27;–&#x27;+Math.min(start+state.pageSize,filtered.length):&#x27;&#x27;}&lt;/span&gt;&lt;div class=&quot;pd-row&quot;&gt;
      ${select(&#x27;pageSize&#x27;,[[6,&#x27;6 条 / 页&#x27;],[10,&#x27;10 条 / 页&#x27;],[20,&#x27;20 条 / 页&#x27;]],state.pageSize,&#x27;aria-label=&quot;每页数量&quot;&#x27;)}
      ${action(&#x27;&#x27;,&#x27;pager&#x27;,{kind:&#x27;pd-icon&#x27;,glyph:&#x27;chevron-left&#x27;,attrs:&#x27;aria-label=&quot;上一页&quot; &#x27;+data(&#x27;key&#x27;,-1)+(state.pageNum===1?&#x27; disabled&#x27;:&#x27;&#x27;)})}
      &lt;span class=&quot;pd-tabular&quot; aria-label=&quot;当前页&quot;&gt;${state.pageNum} / ${pageCount}&lt;/span&gt;
      ${action(&#x27;&#x27;,&#x27;pager&#x27;,{kind:&#x27;pd-icon&#x27;,glyph:&#x27;chevron-right&#x27;,attrs:&#x27;aria-label=&quot;下一页&quot; &#x27;+data(&#x27;key&#x27;,1)+(state.pageNum===pageCount?&#x27; disabled&#x27;:&#x27;&#x27;)})}&lt;/div&gt;&lt;/div&gt;`;
    work.querySelector(&#x27;#pd-results&#x27;).innerHTML=(rows?table([[&#x27;&lt;span class=&quot;pd-sr-only&quot;&gt;展开 SKU&lt;/span&gt;&#x27;,&#x27;pd-expand-col&#x27;],&#x27;商品 / 编码&#x27;,[&#x27;商品分类&#x27;,&#x27;pd-tertiary-col&#x27;],&#x27;SKU 数&#x27;,&#x27;状态&#x27;,[&#x27;更新时间&#x27;,&#x27;pd-secondary-col&#x27;],[&#x27;操作&#x27;,&#x27;pd-right pd-smallhide&#x27;]],rows):blank(&#x27;没有匹配商品&#x27;,&#x27;可尝试更换搜索词或筛选条件。&#x27;,action(&#x27;清除筛选&#x27;,&#x27;reset&#x27;,{kind:&#x27;pd-quiet&#x27;})))+footer;
    icons();
  }
  function productDetail() {
    const p=current();
    const isEnabled=p.status===&#x27;ENABLED&#x27;;
    work.innerHTML=`&lt;div class=&quot;pd-stack&quot;&gt;
      &lt;section class=&quot;pd-panel pd-pad pd-stack pd-archive&quot; aria-labelledby=&quot;pd-archive-title&quot;&gt;
        &lt;header class=&quot;pd-archive-title&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;pd-row&quot;&gt;&lt;span class=&quot;pd-muted pd-mono&quot;&gt;${safe(p.code)}&lt;/span&gt;${badge(p.status)}${version(p)}&lt;/div&gt;&lt;h1 id=&quot;pd-archive-title&quot;&gt;${safe(p.name)}&lt;/h1&gt;&lt;/div&gt;
          &lt;div class=&quot;pd-row&quot;&gt;
            ${action(&#x27;编辑资料&#x27;,&#x27;product-edit&#x27;,{kind:&#x27;pd-primary&#x27;,glyph:&#x27;pencil&#x27;})}
            ${action(isEnabled?&#x27;停用商品&#x27;:&#x27;启用商品&#x27;,&#x27;product-status&#x27;,{glyph:isEnabled?&#x27;pause&#x27;:&#x27;play&#x27;})}
            ${action(&#x27;删除商品&#x27;,&#x27;product-delete&#x27;,{kind:&#x27;pd-outline-danger&#x27;,glyph:&#x27;trash-2&#x27;})}
          &lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;pd-archive-body&quot;&gt;
          ${archivePictures(p.images)}
          &lt;section class=&quot;pd-archive-fields&quot; aria-labelledby=&quot;pd-archive-info&quot;&gt;
            &lt;h2 id=&quot;pd-archive-info&quot;&gt;档案资料&lt;/h2&gt;
            &lt;dl class=&quot;pd-archive-meta&quot;&gt;
              &lt;div&gt;&lt;dt&gt;商品分类&lt;/dt&gt;&lt;dd&gt;${safe(catPath(p.catId))}&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;品牌&lt;/dt&gt;&lt;dd&gt;${safe(p.brand||&#x27;—&#x27;)}&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;更新时间&lt;/dt&gt;&lt;dd&gt;${timestamp(p.updated)}&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;排序&lt;/dt&gt;&lt;dd&gt;${safe(p.sort)}&lt;/dd&gt;&lt;/div&gt;
            &lt;/dl&gt;
            &lt;div&gt;&lt;h3&gt;简要说明&lt;/h3&gt;&lt;p class=&quot;pd-archive-description&quot;&gt;${safe(p.description||&#x27;—&#x27;)}&lt;/p&gt;&lt;/div&gt;
          &lt;/section&gt;
        &lt;/div&gt;
      &lt;/section&gt;
      &lt;section class=&quot;pd-panel pd-detail-skus&quot; aria-labelledby=&quot;pd-detail-sku-title&quot;&gt;${detailSkus(p)}&lt;/section&gt;
      &lt;section class=&quot;pd-panel&quot; aria-labelledby=&quot;pd-detail-specs-title&quot;&gt;${detailSpecs(p)}&lt;/section&gt;
    &lt;/div&gt;`;
  }
  function archivePictures(images) {
    const main=cover(images);
    const mainIndex=images.indexOf(main);
    const picture=(img,i,label)=&gt;`&lt;button type=&quot;button&quot; class=&quot;pd-photo-open&quot; data-action=&quot;image-preview&quot; ${data(&#x27;image&#x27;,i)} aria-label=&quot;${label}&quot;&gt;${thumb(img)}&lt;/button&gt;`;
    const thumbs=images.map((img,i)=&gt;i===mainIndex?&#x27;&#x27;:picture(img,i,&#x27;预览第 &#x27;+(i+1)+&#x27; 张商品图片&#x27;)).join(&#x27;&#x27;);
    const content=main?`&lt;div class=&quot;pd-archive-media&quot;&gt;&lt;div class=&quot;pd-detail-cover&quot;&gt;${picture(main,mainIndex,&#x27;预览商品主图&#x27;)}&lt;span class=&quot;pd-imagelabel pd-badge pd-cover&quot;&gt;主图&lt;/span&gt;&lt;/div&gt;
      ${thumbs?`&lt;div class=&quot;pd-archive-thumbs&quot; aria-label=&quot;其他商品图片&quot;&gt;${thumbs}&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;`:
      `&lt;div class=&quot;pd-archive-empty&quot;&gt;${icon(&#x27;package&#x27;)}&lt;span&gt;暂无商品图片&lt;/span&gt;&lt;/div&gt;`;
    return `&lt;section aria-labelledby=&quot;pd-archive-pictures&quot;&gt;&lt;div class=&quot;pd-row pd-between&quot;&gt;&lt;h2 id=&quot;pd-archive-pictures&quot;&gt;商品图片${images.length?` &lt;span class=&quot;pd-badge pd-count&quot;&gt;${images.length}&lt;/span&gt;`:&#x27;&#x27;}&lt;/h2&gt;
      ${action(&#x27;管理图片&#x27;,&#x27;images-edit&#x27;,{kind:&#x27;pd-quiet&#x27;,glyph:&#x27;image-plus&#x27;})}&lt;/div&gt;${content}&lt;/section&gt;`;
  }
  function skuTable(p) {
    const columns=[&#x27;图片 / 货号 / 型号&#x27;,&#x27;规格&#x27;,&#x27;参考价格&#x27;,&#x27;当前库存&#x27;,&#x27;状态&#x27;,[&#x27;操作&#x27;,&#x27;pd-right&#x27;]];
    const rows=ordered(p.skus).map(s=&gt;{
      const args=data(&#x27;key&#x27;,s.id)+&#x27; &#x27;+data(&#x27;pid&#x27;,p.id);
      const statusLabel=s.status===&#x27;ENABLED&#x27;?&#x27;停用&#x27;:&#x27;启用&#x27;;
      const stock=action(&#x27;库存&#x27;,&#x27;stock&#x27;,{kind:&#x27;pd-quiet&#x27;,attrs:args+&#x27; aria-label=&quot;设置库存 &#x27;+safe(s.code)+&#x27;&quot;&#x27;});
      const rowActions=[
        action(&#x27;编辑&#x27;,&#x27;sku-edit&#x27;,{kind:&#x27;pd-quiet&#x27;,attrs:args+&#x27; aria-label=&quot;编辑 SKU &#x27;+safe(s.code)+&#x27;&quot;&#x27;}),
        stock,
        action(&#x27;图片&#x27;,&#x27;sku-images-edit&#x27;,{kind:&#x27;pd-quiet&#x27;,attrs:args+&#x27; aria-label=&quot;管理 SKU 图片 &#x27;+safe(s.code)+&#x27;&quot;&#x27;}),
        action(statusLabel,&#x27;sku-status&#x27;,{kind:&#x27;pd-quiet&#x27;,attrs:args+&#x27; aria-label=&quot;&#x27;+statusLabel+&#x27; SKU &#x27;+safe(s.code)+&#x27;&quot;&#x27;}),
        action(&#x27;删除&#x27;,&#x27;sku-delete&#x27;,{kind:&#x27;pd-quiet pd-sku-remove&#x27;,attrs:args+&#x27; aria-label=&quot;删除 SKU &#x27;+safe(s.code)+&#x27;&quot;&#x27;})
      ].join(&#x27;&#x27;);
      const spec=specRows(p,s).map(r=&gt;`&lt;span&gt;${safe(r.name)} ${safe(r.value)}${r.unit?&#x27; &#x27;+safe(r.unit):&#x27;&#x27;}&lt;/span&gt;`).join(&#x27;&#x27;);
      return `&lt;tr&gt;&lt;td class=&quot;pd-sku-id&quot;&gt;&lt;div class=&quot;pd-sku-identity&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;pd-photo-open&quot; data-action=&quot;sku-images&quot; ${args} aria-label=&quot;查看 ${safe(s.code)} 的图片&quot;&gt;${thumb(skuCover(p,s))}&lt;/button&gt;
        &lt;div&gt;&lt;div class=&quot;pd-mono pd-sku-code&quot;&gt;${safe(s.code)}&lt;/div&gt;&lt;div class=&quot;pd-muted&quot;&gt;${safe(s.model||&#x27;—&#x27;)}&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;&lt;/td&gt;&lt;td class=&quot;pd-sku-combination&quot;&gt;&lt;div class=&quot;pd-sku-specs&quot;&gt;${spec||&#x27;&lt;span class=&quot;pd-muted&quot;&gt;默认规格&lt;/span&gt;&#x27;}&lt;/div&gt;&lt;/td&gt;
      &lt;td class=&quot;pd-sku-pricing&quot;&gt;&lt;div class=&quot;pd-price-line&quot;&gt;&lt;span class=&quot;pd-muted pd-price-legend&quot;&gt;采购&lt;/span&gt;${moneyText(s.purchase,s.purchaseCurrency)}&lt;/div&gt;&lt;div class=&quot;pd-price-line&quot;&gt;&lt;span class=&quot;pd-muted pd-price-legend&quot;&gt;售价&lt;/span&gt;${moneyText(s.sale,s.saleCurrency)}&lt;/div&gt;&lt;/td&gt;
      &lt;td class=&quot;pd-sku-stock pd-nowrap pd-tabular&quot;&gt;${stockWithScale(s)}&lt;/td&gt;&lt;td class=&quot;pd-sku-state&quot;&gt;${badge(s.status)}&lt;/td&gt;
      &lt;td class=&quot;pd-sku-work&quot;&gt;&lt;div class=&quot;pd-row pd-sku-actions pd-sku-actions-direct&quot;&gt;${rowActions}&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;`;
    }).join(&#x27;&#x27;);
    return `&lt;div class=&quot;pd-sku-table&quot;&gt;${table(columns,rows)}&lt;/div&gt;`;
  }
  function detailSkus(p) {
    const header=`&lt;div class=&quot;pd-sectiontop pd-row pd-between&quot;&gt;&lt;h2 id=&quot;pd-detail-sku-title&quot; class=&quot;pd-row&quot;&gt;SKU 列表 &lt;span class=&quot;pd-badge pd-count&quot;&gt;${p.skus.length}&lt;/span&gt;&lt;/h2&gt;${action(&#x27;新增 SKU&#x27;,&#x27;sku-new&#x27;,{kind:&#x27;pd-primary&#x27;,glyph:&#x27;plus&#x27;,attrs:!p.dimensions.length&amp;&amp;p.skus.length?&#x27;disabled&#x27;:&#x27;&#x27;})}&lt;/div&gt;`;
    return header+(p.status===&#x27;DISABLED&#x27;?&#x27;&lt;div class=&quot;pd-warn&quot; style=&quot;margin:0 15px 11px&quot;&gt;当前商品已停用，所属 SKU 暂不出现在选品结果中。各 SKU 的启停状态继续保留。&lt;/div&gt;&#x27;:&#x27;&#x27;)+(p.skus.length?skuTable(p):blank(&#x27;暂无 SKU&#x27;,&#x27;添加实际经营的规格组合。&#x27;));
  }
  function detailSpecs(p) {
    const locked=p.skus.length&gt;0 || businessUsed(p);
    const header=`&lt;div class=&quot;pd-row pd-between&quot;&gt;&lt;h2 id=&quot;pd-detail-specs-title&quot; class=&quot;pd-row&quot;&gt;结构化规格 &lt;span class=&quot;pd-badge pd-count&quot;&gt;${p.dimensions.length}&lt;/span&gt;&lt;/h2&gt;${action(&#x27;新增维度&#x27;,&#x27;dimension-new&#x27;,{glyph:&#x27;plus&#x27;,attrs:locked?&#x27;disabled&#x27;:&#x27;&#x27;})}&lt;/div&gt;`;
    const items=ordered(p.dimensions).map(d=&gt;`&lt;section class=&quot;pd-dim&quot;&gt;&lt;div class=&quot;pd-row pd-between&quot;&gt;
      &lt;div class=&quot;pd-row&quot;&gt;&lt;h3&gt;${safe(d.name)}&lt;/h3&gt;&lt;span class=&quot;pd-badge&quot;&gt;${d.type===&#x27;TEXT&#x27;?&#x27;文本&#x27;:&#x27;数值&#x27;+(d.unitId?&#x27; · &#x27;+safe(unit(d.unitId)?.name||&#x27;&#x27;):&#x27;&#x27;)}&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;pd-row&quot;&gt;${action(&#x27;编辑维度&#x27;,&#x27;dimension-edit&#x27;,{kind:&#x27;pd-quiet&#x27;,attrs:data(&#x27;key&#x27;,d.id)})}${action(&#x27;新增候选值&#x27;,&#x27;value-new&#x27;,{glyph:&#x27;plus&#x27;,attrs:data(&#x27;key&#x27;,d.id)})}&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;pd-row&quot;&gt;${ordered(d.values).map(v=&gt;action(safe(v.value)+(usedValue(p,d,v)?icon(&#x27;lock-keyhole&#x27;):&#x27;&#x27;),&#x27;value-edit&#x27;,{kind:&#x27;pd-chip&#x27;,attrs:data(&#x27;key&#x27;,d.id)+&#x27; &#x27;+data(&#x27;val&#x27;,v.id)+&#x27; aria-label=&quot;编辑候选值 &#x27;+safe(d.name+&#x27; &#x27;+v.value)+&#x27;&quot;&#x27;})).join(&#x27;&#x27;)||&#x27;&lt;span class=&quot;pd-muted&quot;&gt;暂无候选值&lt;/span&gt;&#x27;}&lt;/div&gt;&lt;/section&gt;`).join(&#x27;&#x27;);
    return `&lt;div class=&quot;pd-pad pd-stack&quot;&gt;${header}${locked?note(&#x27;已有 SKU 或业务引用。维度结构已锁定，可修正名称、排序和新增候选值。&#x27;):&#x27;&#x27;}${items?&#x27;&lt;div&gt;&#x27;+items+&#x27;&lt;/div&gt;&#x27;:blank(&#x27;暂无结构化规格&#x27;,p.skus.length?&#x27;该商品使用一条默认 SKU。&#x27;:&#x27;可新增维度后再建立 SKU。&#x27;)}&lt;/div&gt;`;
  }

  function pickerResults() {

          if(c.minimum?.trim()) numeric(c.minimum,6,d.name+&#x27;最小值&#x27;,false,true);

      `&lt;p class=&quot;pd-muted&quot; role=&quot;status&quot;&gt;共 ${results.length} 条可选 SKU&lt;/p&gt;`+table([&#x27;商品 / 货号&#x27;,&#x27;型号 / 规格&#x27;,&#x27;库存&#x27;,&#x27;参考售价&#x27;,[&#x27;操作&#x27;,&#x27;pd-right&#x27;]],rows):

  function applyCatalogEdits(form) {
