server:
  port: 8081

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      # 为表单字段和 multipart 边界预留空间。
      max-request-size: 101MB
  web:
    resources:
      add-mappings: false
  messages:
    basename: i18n/common/messages,i18n/system/messages,i18n/website/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  lifecycle:
    # 配置优雅停机宽限时间，即项目在 15s 都没处理完，则进行强制关闭
    timeout-per-shutdown-phase: 15s
  application:
    name: mini-erp
  profiles:
    active: dev

# Mybatis Plus 打印日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-value: true
      logic-not-delete-value: false

# 设置日志等级
logging:
  config: classpath:log4j2-spring.xml
  file:
    path: logs
  level:
    com.muzhi.minierp.mapper: debug
