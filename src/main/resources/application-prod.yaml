spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/mini_erp_prod
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
  data:
    redis:
      host: redis
      password: ${SPRING_DATA_REDIS_PASSWORD}
      port: 6379
      database: 0
      timeout: 10s
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 10s


security:
  jwt:
    issuer: ${SECURITY_JWT_ISSUER}
    secret: ${SECURITY_JWT_SECRET}
    expire-minutes: 1440


oss:
  access-key: ${OSS_ACCESS_KEY}
  secret-key: ${OSS_SECRET_KEY}
  internal-endpoint: ${OSS_INTERNAL_ENDPOINT}
  external-endpoint: ${OSS_EXTERNAL_ENDPOINT}
  bucket-name: 'mini-erp-pro'


vault:
  enabled: true
  origin: ${VAULT_ORIGIN}
  rp-id: ${VAULT_RP_ID}
